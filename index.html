<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicholas Ibarluzea</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --fg: #1a1a1a;
    --accent: #2563eb;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #eaeaea;
      --accent: #6ea8fe;
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  main {
    text-align: center;
  }

  h1 {
    margin: 0 0 0.75rem;
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  a {
    color: var(--accent);
    text-decoration: none;
    font-size: 1.1rem;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s ease;
  }

  a:hover,
  a:focus-visible {
    border-bottom-color: currentColor;
  }
</style>
</head>
<body>
  <main>
    <h1>Nicholas Ibarluzea</h1>
    <a href="https://www.linkedin.com/in/nicholas-ibarluzea/">LinkedIn</a>
  </main>
</body>
</html>
